name: Alexios Python Tests

on:
  push:
    branches: [main, refactor/python-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26,<3" "sounddevice>=0.5,<1" "python-dotenv>=1,<2"
      - name: Compile Python
        run: python -m compileall -q main.py agent scripts tests
      - name: Check CLI initialization
        run: python main.py --help
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
