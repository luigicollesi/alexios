name: Ambient Python Tests

on:
  push:
    branches: [feature/ambient-listening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3"
      - run: python -m compileall -q continuous.py audio_windows.py tests/test_audio_windows.py
      - run: python -m unittest discover -s tests -v
