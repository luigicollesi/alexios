<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de blocos — Alexios Python no Raspberry Pi 4</title>
<desc id="desc">Tomada elétrica fornece energia ao Raspberry Pi 4 por fonte USB-C apropriada. Microfone USB conecta-se ao Raspberry Pi 4 por uma porta USB.</desc>
